[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"
  edge_functions = "netlify/edge-functions"

[[edge_functions]]
  path = "/api/*"
  function = "api"

[[headers]]
  for = "/api/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type"
    Content-Type = "application/json; charset=utf-8"

[[redirects]]
  from = "/api/v1/barnabodha"
  to = "/api/v1/barnabodha.json"
  status = 200

[[redirects]]
  from = "/api/v1/swarabarna"
  to = "/api/v1/swarabarna.json"
  status = 200

[[redirects]]
  from = "/api/v1/swara"
  to = "/api/v1/swarabarna.json"
  status = 200

